name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Lint and SAST
        run: |
          brew install swiftlint swift-format
          pipx install semgrep
          make lint sast

      - name: Integration
        run: ./scripts/integration-test.sh

  floor:
    # The oldest toolchain the README promises. Catches use of API newer
    # than MIN_SWIFT, which the default Xcode above would happily accept.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - run: swift --version
      - run: swift build -c release
      - run: swift test
