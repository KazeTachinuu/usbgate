name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Lint and SAST
        run: |
          brew install swiftlint swift-format
          pipx install semgrep
          make lint sast

      - name: Integration
        run: ./scripts/integration-test.sh
