name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The package needs Swift 6.2 or later for strict memory safety; the
      # runner's bundled Xcode is older.
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.3"

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Lint and SAST
        run: |
          brew install swiftlint swift-format
          pipx install semgrep
          make lint sast

      - name: Integration
        run: ./scripts/integration-test.sh
