# Every opt-in SwiftLint rule is enabled except those listed under
# disabled_rules, each of which is excluded for a stated reason.
# Run with --strict: every warning is an error.

included: [Sources, Tests]
strict: true

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - attributes
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_default_parameter
  - discouraged_none_name
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - expiring_todo
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - file_name_no_space
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - function_default_parameter_at_end
  - ibinspectable_in_extension
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_uigraphics_function
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_function_chains
  - nimble_operator
  - no_empty_block
  - no_extension_access_modifier
  - non_overridable_class_declaration
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - period_spacing
  - prefer_asset_symbols
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - private_action
  - private_outlet
  - private_subject
  - private_swiftui_state
  - prohibited_interface_builder
  - prohibited_super_call
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_final
  - redundant_nil_coalescing
  - redundant_self
  - redundant_type_annotation
  - required_enum_case
  - return_value_from_void_function
  - self_binding
  - shorthand_argument
  - shorthand_optional_binding
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_escaping
  - unneeded_parentheses_in_closure_argument
  - unneeded_throws_rethrows
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_parameter
  - variable_shadowing
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

analyzer_rules:          # require `swiftlint analyze` against a compiler log
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

disabled_rules:
  - multiline_call_arguments  # swift-format owns call wrapping
  - extension_access_modifier  # swift-format's NoAccessLevelOnExtensionDeclaration strips it
  - let_var_whitespace  # swift-format owns blank lines
  - anonymous_argument_in_multiline_closure  # $0 is clearer in the two short closures here
  - balanced_xctest_lifecycle  # swift-testing, not XCTest
  - conditional_returns_on_newline  # one-line guard-else is the idiom this code is built on
  - contrasted_opening_brace  # fights swift-format and standard K&R Swift braces
  - discouraged_optional_collection  # nil means keep-the-default, which empty cannot express
  - explicit_acl  # noise; access control is already explicit where it matters
  - explicit_enum_raw_value  # our enums carry associated values, not raw ones
  - explicit_top_level_acl  # same
  - explicit_type_interface  # defeats Swift type inference
  - file_types_order  # prescriptive ordering, no defect class behind it
  - indentation_width  # swift-format owns indentation
  - legacy_objc_type  # NSNumber is required to bridge CFNumber from IOKit
  - multiline_arguments  # swift-format owns wrapping
  - multiline_arguments_brackets  # swift-format owns wrapping
  - multiline_literal_brackets  # swift-format owns wrapping
  - multiline_parameters  # swift-format owns wrapping
  - multiline_parameters_brackets  # swift-format owns wrapping
  - no_grouping_extension  # MARK-grouped extensions are the house style
  - no_magic_numbers  # USB class codes are the domain vocabulary, named where it matters
  - one_declaration_per_file  # Policy.swift is one cohesive value-type module
  - prefer_nimble  # not using Nimble
  - quick_discouraged_call  # not using Quick
  - quick_discouraged_focused_test  # not using Quick
  - quick_discouraged_pending_test  # not using Quick
  - required_deinit  # no class here owns a resource past process lifetime
  - single_test_class  # swift-testing suites, not XCTest classes
  - sorted_enum_cases  # Reason is ordered by decision sequence, which is the useful order
  - strict_fileprivate  # the Disk Arbitration C callback needs fileprivate access
  - switch_case_on_newline  # fights swift-format
  - test_case_accessibility  # swift-testing, not XCTest
  - trailing_closure  # fights the parseDevices(_:onDrop:) signature
  - type_contents_order  # same
  - vertical_parameter_alignment_on_call  # swift-format owns wrapping
  - vertical_whitespace_between_cases  # fights swift-format
  - prefixed_toplevel_constant  # k-prefix is an ObjC convention, contrary to the Swift API guidelines
  - discouraged_default_parameter  # default arguments keep the test helpers readable
  - explicit_self  # analyzer-only style rule, not a defect class

trailing_comma:
  mandatory_comma: true   # matches swift-format, which adds them

number_separator:
  minimum_length: 6

line_length:
  warning: 100
  error: 120
  ignores_comments: false

identifier_name:
  min_length: 2
  excluded: [id, ok, no]

